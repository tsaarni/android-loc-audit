[project]
name = "android-loc-audit"
version = "0.1.0"
description = "Static-first location tracking audit for unrooted Android phones"
requires-python = ">=3.11"
dependencies = [
    "dpkt>=1.9.8",
]

[project.scripts]
audit = "locaudit.cli:main"
locaudit = "locaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locaudit"]
